<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC eEvelyn Saint</title>
    <style>
        /* Estilos CSS */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #ffffff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 350px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 1.5rem;
        }

        .input-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #666;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box; /* Garante que o padding não aumente a largura */
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #0056b3;
        }

        #result-area {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 6px;
            display: none; /* Escondido até o cálculo */
        }

        .bmi-value {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .bmi-status {
            font-weight: 500;
        }

        /* Cores para os resultados */
        .normal { background-color: #d4edda; color: #155724; }
        .warning { background-color: #fff3cd; color: #856404; }
        .danger { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Calculadora IMC</h1>
        
        <div class="input-group">
            <label for="weight">Peso (kg)</label>
            <input type="number" id="weight" placeholder="Ex: 75.5" step="0.1">
        </div>

        <div class="input-group">
            <label for="height">Altura (cm)</label>
            <input type="number" id="height" placeholder="Ex: 175">
        </div>

        <button onclick="calculateBMI()">Calcular</button>

        <div id="result-area">
            <div class="bmi-value" id="bmi-result">0</div>
            <div class="bmi-status" id="bmi-status">Status</div>
        </div>
    </div>

    <script>
        // Lógica JavaScript Vanilla
        function calculateBMI() {
            const weightInput = document.getElementById('weight');
            const heightInput = document.getElementById('height');
            const resultArea = document.getElementById('result-area');
            const bmiResult = document.getElementById('bmi-result');
            const bmiStatus = document.getElementById('bmi-status');

            const weight = parseFloat(weightInput.value);
            const heightCm = parseFloat(heightInput.value);

            // Validação simples
            if (!weight || !heightCm || weight <= 0 || heightCm <= 0) {
                alert("Por favor, insira valores válidos para peso e altura.");
                return;
            }

            // Cálculo do IMC: peso / altura_em_metros²
            const heightM = heightCm / 100;
            const imc = (weight / (heightM * heightM)).toFixed(1);

            // Determinar classificação e cor
            let status = "";
            let cssClass = "";

            if (imc < 18.5) {
                status = "Abaixo do peso";
                cssClass = "warning";
            } else if (imc >= 18.5 && imc <= 24.9) {
                status = "Peso Normal";
                cssClass = "normal";
            } else if (imc >= 25 && imc <= 29.9) {
                status = "Sobrepeso";
                cssClass = "warning";
            } else if (imc >= 30 && imc <= 34.9) {
                status = "Obesidade Grau I";
                cssClass = "danger";
            } else if (imc >= 35 && imc <= 39.9) {
                status = "Obesidade Grau II";
                cssClass = "danger";
            } else {
                status = "Obesidade Grau III";
                cssClass = "danger";
            }

            // Exibir resultados
            bmiResult.textContent = imc;
            bmiStatus.textContent = status;
            
            // Limpar classes anteriores e aplicar a nova
            resultArea.className = ""; 
            resultArea.classList.add(cssClass);
            resultArea.style.display = "block";
        }
    </script>

</body>
</html>
